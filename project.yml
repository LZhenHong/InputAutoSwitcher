name: InputAutoSwitcher

attributes:
  LastUpgradeCheck: "2630"

options:
  minimumXcodeGenVersion: 2.42.0
  bundleIdPrefix: io.lzhlovesjyq
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: V65YCRQZ2M
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_COMPILATION_MODE: singlefile
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO

targets:
  InputAutoSwitcher:
    type: application
    platform: macOS
    sources:
      - path: InputAutoSwitcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lzhlovesjyq.InputAutoSwitcher
        PRODUCT_NAME: InputAutoSwitcher
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: InputAutoSwitcher
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Eden. All rights reserved."
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES

  InputAutoSwitcherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: InputAutoSwitcherTests
    dependencies:
      - target: InputAutoSwitcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lzhlovesjyq.InputAutoSwitcherTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/InputAutoSwitcher.app/Contents/MacOS/InputAutoSwitcher
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  InputAutoSwitcher:
    build:
      targets:
        InputAutoSwitcher: all
        InputAutoSwitcherTests: [test]
      parallelizeBuild: true
      buildImplicitDependencies: true
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - InputAutoSwitcherTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
